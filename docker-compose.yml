name: entrega3

# Los valores por defecto son los de la Entrega 1. Jenkins los cambia en cada build
# (TAG, PREFIJO, RED, APP_HOST_PORT) para levantar una copia aislada sin chocar con
# contenedores que ya estén corriendo en el mismo equipo.
services:
  # Contenedor 2: base de datos PostgreSQL
  db:
    build:
      context: ./db
    image: entrega3-db:${TAG:-1.0.0}
    container_name: ${PREFIJO:-notas}-db
    restart: unless-stopped
    # Variables: valores de ejemplo de .env.example; si existe .env, este los reemplaza
    env_file:
      - path: .env.example
      - path: .env
        required: false
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - red_notas
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Contenedor 1: API de notas
  app:
    build:
      context: ./app
    image: entrega3-app:${TAG:-1.0.0}
    container_name: ${PREFIJO:-notas}-app
    restart: unless-stopped
    env_file:
      - path: .env.example
      - path: .env
        required: false
    environment:
      DB_HOST: localhost     # ERROR a propósito: dentro del contenedor, localhost es el propio contenedor app
      DB_PORT: 5432
      APP_PORT: 3000
    ports:
      - "${APP_HOST_PORT:-3000}:3000"
    networks:
      - red_notas
    depends_on:
      db:
        condition: service_healthy

networks:
  red_notas:
    name: ${RED:-red_notas}
    driver: bridge

volumes:
  db_data:
    name: ${PREFIJO:-notas}_db_data
